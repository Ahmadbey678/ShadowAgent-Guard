name: ShadowAgent Guard

on:
  pull_request:

permissions:
  contents: read
  security-events: write # SARIF upload to GitHub Code Scanning
  actions: read          # required by upload-sarif on private repos

jobs:
  scan:
    name: Supply-chain security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Dogfood: run this repository's own composite action (action.yml).
      # Other repos use: Ahmadbey678/ShadowAgent-Guard@main
      - name: ShadowAgent Guard
        uses: ./
        with:
          fail-on: high
